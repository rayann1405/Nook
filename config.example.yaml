# Nook — Configuration utilisateur (~/.config/nook/config.yaml)

ollama:
  base_url: "http://localhost:11434"
  # Auto prefers 3B when RAM allows, then 1B.
  model: auto
  temperature: 0.3
  max_iterations: 8
  num_ctx: 2048

router:
  mode: auto
  cloud_enabled: true
  max_cloud_calls: 5
  low_memory_threshold_gb: 3.0

meta:
  base_url: "https://api.meta.ai/v1"
  model: "muse-spark-1.3"
  # Renseignez la clé ici ou dans un fichier .env (META_API_KEY=...).
  # Le fichier ~/.config/nook/config.yaml est créé en chmod 600.
  api_key: ""

ui:
  language: fr
  hotkey: "ctrl+alt+space"
  bubble_opacity: 0.85
  expanded_width: 420
  expanded_height: 600
  bubble_size: 44
  screen_margin: 8

agent:
  default_cwd: "~"
  max_file_bytes: 65536

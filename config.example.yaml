# Nook — Configuration utilisateur (~/.config/nook/config.yaml)

ollama:
  base_url: "http://localhost:11434"
  # Auto prefers 3B when RAM allows, then 1B.
  model: auto
  temperature: 0.3
  max_iterations: 8
  num_ctx: 2048

router:
  mode: auto
  cloud_enabled: true
  max_cloud_calls: 5
  low_memory_threshold_gb: 3.0

meta:
  base_url: "https://api.meta.ai/v1"
  model: "muse-spark-1.3"

ui:
  theme: dark
  hotkey: "ctrl+alt+space"
  bubble_opacity: 0.42
  expanded_width: 380
  expanded_height: 520
  bubble_size: 22
  screen_margin: 6

agent:
  default_cwd: "~"
  max_file_bytes: 65536

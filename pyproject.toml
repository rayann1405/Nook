[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nook"
version = "1.0.0"
description = "Assistant IA local discret pour Ubuntu"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "pynput>=1.7.6",
]

[project.scripts]
nook = "nook.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nook*"]
